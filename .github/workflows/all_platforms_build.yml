name: Build All Platforms

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mihomo-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Dart checks
  # ===========================================================================
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.3'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Validate desktop fetcher
        run: python3 -m py_compile tool/fetch_mihomo.py

  # ===========================================================================
  # Android Build
  # ===========================================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;28.0.13004108"

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.3'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Mihomo Android libraries
        run: ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.0.13004108" bash tool/build_android_core.sh

      - name: Apply Build Configuration (Name, Logo)
        run: dart run tool/apply_config.dart

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/*-release.apk

  # ===========================================================================
  # Windows Build
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.3'

      - name: Fetch verified Mihomo core
        run: python tool/fetch_mihomo.py --platform windows --arch amd64

      - name: Get dependencies
        run: flutter pub get

      - name: Apply Build Configuration (Name, Logo, Process Name)
        run: dart run tool/apply_config.dart

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Windows Release
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows-release.zip

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-zip
          path: windows-release.zip

  # ===========================================================================
  # macOS Build
  # ===========================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.3'

      - name: Fetch verified Mihomo core
        run: python3 tool/fetch_mihomo.py --platform macos --arch universal

      - name: Get dependencies
        run: flutter pub get

      - name: Apply Build Configuration (Name, Logo)
        run: dart run tool/apply_config.dart

      - name: Build macOS
        run: flutter build macos --release

      - name: Compress macOS Release
        run: |
          cd build/macos/Build/Products/Release
          tar -czf ../../../../../macos-release.tar.gz *.app

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-app
          path: macos-release.tar.gz

  # ===========================================================================
  # Linux Build
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.3'

      - name: Fetch verified Mihomo core
        run: python3 tool/fetch_mihomo.py --platform linux --arch amd64

      - name: Get dependencies
        run: flutter pub get

      - name: Apply Build Configuration (Name, Logo)
        run: dart run tool/apply_config.dart

      - name: Build Linux
        run: flutter build linux --release

      - name: Compress Linux Release
        run: tar -czf linux-release.tar.gz -C build/linux/x64/release bundle

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-bundle
          path: linux-release.tar.gz
